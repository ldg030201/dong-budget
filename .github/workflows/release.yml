name: 배포

# v1.0.1 같은 태그를 올리면 서명된 APK 를 만들어 Releases 에 올린다.
# 앱(github 빌드)은 여기 올라온 APK 를 보고 새 버전을 확인한다.
# Play 배포(play 빌드)용 AAB 도 같은 키로 만들어 워크플로 결과물로 남기고, 켜 두었으면 Play 내부 테스트에 올린다.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 같은 태그로 두 번 돌면 릴리스 자산을 서로 덮어쓴다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # ubuntu-latest 는 2026-10-19 에 Ubuntu 26 으로 바뀐다.
    # 배포 파이프라인이 예고 없이 깨지지 않도록 러너를 고정한다.
    # 올릴 때는 일부러 올리고 빌드가 통과하는지 확인한 뒤 바꾼다.
    runs-on: ubuntu-24.04
    steps:
      # 이전 배포 태그와 versionCode 를 비교하려면 태그 기록이 필요하다(기본값은 마지막 커밋 하나만 받는다)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # gradle/gradle-daemon-jvm.properties 가 데몬 JVM 을 25 로 고정한다.
      # 여기서 25 를 깔아두지 않으면 Gradle 이 빌드마다 JDK 를 새로 내려받는다(약 145MB).
      - name: JDK 25 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v4

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v5

      # 태그와 앱 버전이 어긋난 채로 배포되면
      # 앱이 새 버전을 확인할 때 계속 업데이트가 있다고 하거나 아예 못 찾는다.
      - name: 태그와 앱 버전이 같은지 확인
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(grep '^dongbudget.versionName=' gradle.properties | cut -d= -f2)
          echo "태그: $TAG_VERSION / gradle.properties: $APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::태그($TAG_VERSION)와 gradle.properties 의 versionName($APP_VERSION)이 다르다."
            echo "::error::gradle.properties 의 versionCode 와 versionName 을 올리고 같은 이름으로 태그를 다시 만들어라."
            exit 1
          fi

      # versionCode 가 이전 배포보다 크지 않으면 기기가 설치를 거부한다(INSTALL_FAILED_VERSION_DOWNGRADE).
      # 그런데 앱은 versionName 만 비교하므로 새 버전이 있다고 계속 알린다. 배포 전에 막는다.
      - name: versionCode 가 이전 배포보다 큰지 확인
        run: |
          CODE=$(grep '^dongbudget.versionCode=' gradle.properties | cut -d= -f2)
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            echo "이전 배포 태그가 없다. 첫 배포로 본다."
            exit 0
          fi
          PREV_CODE=$(git show "${PREV_TAG}:gradle.properties" | grep '^dongbudget.versionCode=' | cut -d= -f2)
          echo "이전 배포 ${PREV_TAG}: ${PREV_CODE} / 이번: ${CODE}"
          if [ "$CODE" -le "$PREV_CODE" ]; then
            echo "::error::versionCode(${CODE})가 이전 배포 ${PREV_TAG} 의 ${PREV_CODE} 보다 커야 한다."
            exit 1
          fi

      # 테스트가 깨진 채로 배포되지 않게 한다. main 의 CI 와 따로 돌기 때문에 여기서 다시 돌린다.
      # (패치노트 기록 누락, 버전 비교, 결제 알림 읽기 같은 규칙을 테스트가 지킨다)
      # 공통 테스트는 github 빌드에서 한 번만, play 빌드는 play 전용 테스트만 돌린다(app/build.gradle.kts).
      # 혼자 6분 넘게 걸리는 고정지출 시뮬레이션은 지난 배포 뒤로 그것이 보는 코드(고정지출 계산 · DB 거래 · 공휴일 표 ·
      # 날짜 · 가게 이름 함수와 그 테스트)가 바뀌었을 때만 돌린다. 안 바뀌었으면 지난 배포 때 통과한 그대로다.
      # 시뮬레이션이 새 코드를 보기 시작하면 아래 목록에도 더한다.
      - name: 단위 테스트
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          SLOW_FLAG=""
          if [ -n "$PREV_TAG" ] && git diff --quiet "$PREV_TAG" HEAD -- \
              app/src/main/java/com/dong/budget/ui/fixed \
              app/src/main/java/com/dong/budget/data/db \
              app/src/main/java/com/dong/budget/data/holiday \
              app/src/main/java/com/dong/budget/ui/home/MonthOverview.kt \
              app/src/main/java/com/dong/budget/ui/stats/calc/Merchants.kt \
              app/src/test/java/com/dong/budget/ui/fixed \
              app/src/test/java/com/dong/budget/testing; then
            echo "지난 배포 ${PREV_TAG} 뒤로 시뮬레이션이 보는 코드가 안 바뀌어 고정지출 시뮬레이션을 건너뛴다."
            SLOW_FLAG="-Pdongbudget.skipSlowTests"
          else
            echo "시뮬레이션이 보는 코드가 바뀌었거나 첫 배포라 고정지출 시뮬레이션도 돌린다."
          fi
          ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest -Pdongbudget.flavorTestsOnly $SLOW_FLAG

      # 서명키는 저장소에 두지 않는다. Secrets 에 base64 로 넣어두고 여기서만 되살린다.
      # 키가 바뀌면 기존 사용자의 업데이트 설치와 자동 백업 복원이 모두 깨지므로
      # 한 번 만든 키는 절대 바꾸지 않는다.
      # 네 개 중 하나라도 비면 Gradle 이 서명 설정을 만들지 않고
      # 서명 없는 APK 를 조용히 만들어낸다. 여기서 먼저 막는다.
      - name: 서명 시크릿이 모두 있는지 확인
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::서명 시크릿이 없다:$missing"
            echo "::error::저장소 Settings → Secrets and variables → Actions 에서 등록하라."
            exit 1
          fi

      - name: 서명키 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # GitHub 배포용 APK 와 Play 배포용 AAB 를 같은 키로 만든다.
      # Play 앱 서명에도 이 키를 쓰므로(docs/배포.md) 어느 쪽으로 받은 앱이든 서로 덮어 설치할 수 있다.
      - name: 서명된 APK·AAB 빌드
        env:
          DONG_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          DONG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DONG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DONG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease bundlePlayRelease

      # 서명이 붙었는지, 그리고 '올바른 키로' 붙었는지 확인한다.
      #
      # 두 번째가 핵심이다. 서명키가 바뀐 APK 를 배포하면 기존 사용자는
      # 업데이트를 설치할 수 없고, 앱을 지우고 새로 깔아야 해서 가계부가 전부 사라진다.
      # 배포한 뒤에는 되돌릴 방법이 없으므로 여기서 막는다.
      - name: 서명과 서명키 확인
        run: |
          APK=$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)
          echo "APK: $APK"
          if [ -z "$APK" ]; then echo "::error::APK 를 찾지 못했다."; exit 1; fi
          case "$APK" in
            *unsigned*) echo "::error::서명되지 않은 APK 다. 시크릿 설정을 확인하라."; exit 1 ;;
          esac

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt

          if [ ! -f .signing-fingerprint ]; then
            echo "::error::.signing-fingerprint 가 없어서 서명키를 대조할 수 없다."
            echo "::error::로컬에서 ./scripts/release.sh 를 한 번 돌려 지문을 기록하고 커밋하라."
            exit 1
          fi
          EXPECTED=$(tr -d '[:space:]' < .signing-fingerprint)
          if ! grep -qi "$EXPECTED" certs.txt; then
            echo "::error::서명키가 .signing-fingerprint 와 다르다. 배포를 중단한다."
            echo "::error::이대로 내보내면 기존 사용자가 업데이트를 설치할 수 없고 가계부가 사라진다."
            echo "::error::정말로 키를 바꾸는 것이 맞다면 .signing-fingerprint 를 갱신해서 커밋하라."
            exit 1
          fi
          echo "서명키가 기대값과 일치한다."
          rm -f certs.txt
          echo "SIGNED_APK=$APK" >> "$GITHUB_ENV"

      # AAB 도 같은 키로 서명됐는지 본다. AAB 는 APK 와 서명 방식이 달라(JAR 서명) apksigner 대신 JDK 도구로 본다.
      # keytool 은 지문을 'AB:CD:…' 로 보여 주므로 쌍점을 빼고 소문자로 바꿔 .signing-fingerprint 와 견준다.
      - name: AAB 서명과 서명키 확인
        run: |
          AAB=$(find app/build/outputs/bundle/playRelease -name '*.aab' | head -1)
          echo "AAB: $AAB"
          if [ -z "$AAB" ]; then echo "::error::AAB 를 찾지 못했다."; exit 1; fi
          if ! jarsigner -verify "$AAB" > /dev/null; then
            echo "::error::AAB 서명을 확인하지 못했다. 시크릿 설정을 확인하라."
            exit 1
          fi
          ACTUAL=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          EXPECTED=$(tr -d '[:space:]' < .signing-fingerprint | tr 'A-F' 'a-f')
          if [ -z "$ACTUAL" ]; then echo "::error::서명되지 않은 AAB 다."; exit 1; fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::AAB 서명키가 .signing-fingerprint 와 다르다. 배포를 중단한다."
            echo "::error::Play 에 다른 키로 올리면 GitHub 에서 받은 앱 위에 Play 업데이트를 설치할 수 없다."
            exit 1
          fi
          echo "AAB 서명키도 기대값과 일치한다."
          echo "SIGNED_AAB=$AAB" >> "$GITHUB_ENV"

      # AAB 는 Releases 에 올리지 않는다(아래 files 는 dong-budget-*.apk 만 고른다).
      # 앱 내 업데이터는 Releases 에서 .apk 를 찾아 받으므로 거기에 AAB 가 섞이면 안 된다.
      - name: 배포용 이름으로 변경
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$SIGNED_APK" "dong-budget-${VERSION}.apk"
          cp "$SIGNED_AAB" "dong-budget-${VERSION}.aab"
          ls -lh "dong-budget-${VERSION}.apk" "dong-budget-${VERSION}.aab"

      - name: 키 파일 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # 릴리스 본문을 두 구간으로 나눈다.
      #   위: 태그 메시지 (이번에 바뀐 점) — 앱이 업데이트 화면에 보여준다
      #   아래: 처음 설치하는 사람용 안내 — 웹 페이지에서만 보인다
      # 둘 사이의 표시는 HTML 주석이라 웹에는 안 보이고, 앱은 그 위쪽만 읽는다.
      # 표시 문자열은 앱의 ReleaseNotes.APP_NOTES_END 와 반드시 같아야 한다.
      - name: 릴리스 본문 만들기
        run: |
          # actions/checkout 은 태그를 가벼운 태그로 가져와서 메시지가 사라진다. 다시 받아온다.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

          NOTES=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" \
              | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          else
            echo "::warning::가벼운 태그라서 바뀐 점을 적을 수 없다. git tag -a 로 메시지를 달아라."
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          {
            printf '%s\n\n' "$NOTES"
            echo "<!-- dong-budget:app-notes-end -->"
            echo
            sed "s/{{VERSION}}/${VERSION}/g" .github/release-install-guide.md
          } > "$RUNNER_TEMP/release-body.md"

          echo "── 만들어진 본문 ──"
          cat "$RUNNER_TEMP/release-body.md"

      - name: Releases 에 올리기
        uses: softprops/action-gh-release@v3
        with:
          files: dong-budget-*.apk
          # 자동 생성 변경 기록은 본문 뒤에 붙는다. 표시 아래라서 앱에는 안 보인다.
          generate_release_notes: true
          draft: false
          # prerelease 로 올리면 안 된다.
          # GitHub API 의 latest 는 prerelease 를 돌려주지 않아서
          # 앱 내 자동 업데이트가 이 버전을 영영 찾지 못한다.
          # 아직 안정 버전이 아니라는 표시는 0.x 버전 번호가 대신한다.
          prerelease: false
          body_path: ${{ runner.temp }}/release-body.md

      # Play Console 에 처음 올릴 AAB 는 손으로 올려야 한다(Play API 는 앱의 첫 버전을 만들 수 없다).
      # 그때 쓰도록 이 실행의 결과물(Artifacts)로 남긴다. 실행 화면 아래에서 받을 수 있다.
      - name: AAB 를 결과물로 보관
        uses: actions/upload-artifact@v6
        with:
          name: dong-budget-${{ github.ref_name }}-play-aab
          path: dong-budget-*.aab
          if-no-files-found: error

      # 여기부터는 Play 배포다. GitHub Releases 에 올린 뒤에 해서, Play 쪽 문제(설정 전, 권한, 심사 상태)로
      # GitHub 배포가 막히지 않게 한다. 실패는 숨기지 않는다(워크플로가 실패로 끝나니 확인하고 Play Console 에서 손으로 올린다).
      #
      # 둘 다 있을 때만 올린다.
      #   - 저장소 변수 PLAY_UPLOAD_ENABLED 가 true. Play Console 에 첫 AAB 를 손으로 올린 뒤에 켠다.
      #     켜기 전에 올리면 앱이 아직 없다고 실패한다.
      #   - 시크릿 PLAY_SERVICE_ACCOUNT_JSON. Play Console 에 권한을 준 서비스 계정의 키(JSON) 전체
      # 변수를 켰는데 시크릿이 없으면 올리지 못한 것을 알 수 있게 실패로 끝낸다.
      - name: Play 업로드 여부 확인
        id: play
        env:
          PLAY_UPLOAD_ENABLED: ${{ vars.PLAY_UPLOAD_ENABLED }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "$PLAY_UPLOAD_ENABLED" != "true" ]; then
            echo "저장소 변수 PLAY_UPLOAD_ENABLED 가 true 가 아니라서 Play 에는 올리지 않는다."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_UPLOAD_ENABLED 는 켜져 있는데 PLAY_SERVICE_ACCOUNT_JSON 시크릿이 없어 Play 에 올리지 못했다."
            echo "::error::GitHub 배포는 끝났다. 시크릿을 넣고 결과물의 AAB 를 Play Console 에 손으로 올려라."
            exit 1
          fi
          echo "upload=true" >> "$GITHUB_OUTPUT"

      # 내부 테스트 트랙에 바로 내보낸다(completed). 테스터의 Play 스토어가 새 버전을 받고, 앱이 인앱 업데이트로 알린다.
      - name: Play 내부 테스트에 올리기
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dong.budget
          releaseFiles: dong-budget-*.aab
          track: internal
          status: completed
