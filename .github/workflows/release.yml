name: 배포

# v1.0.1 같은 태그를 올리면 서명된 APK 를 만들어 Releases 에 올린다.
# 앱은 여기 올라온 APK 를 보고 새 버전을 확인한다.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 같은 태그로 두 번 돌면 릴리스 자산을 서로 덮어쓴다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # ubuntu-latest 는 2026-10-19 에 Ubuntu 26 으로 바뀐다.
    # 배포 파이프라인이 예고 없이 깨지지 않도록 러너를 고정한다.
    # 올릴 때는 일부러 올리고 빌드가 통과하는지 확인한 뒤 바꾼다.
    runs-on: ubuntu-24.04
    steps:
      # 이전 배포 태그와 versionCode 를 비교하려면 태그 기록이 필요하다(기본값은 마지막 커밋 하나만 받는다)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # gradle/gradle-daemon-jvm.properties 가 데몬 JVM 을 25 로 고정한다.
      # 여기서 25 를 깔아두지 않으면 Gradle 이 빌드마다 JDK 를 새로 내려받는다(약 145MB).
      - name: JDK 25 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v4

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v5

      # 태그와 앱 버전이 어긋난 채로 배포되면
      # 앱이 새 버전을 확인할 때 계속 업데이트가 있다고 하거나 아예 못 찾는다.
      - name: 태그와 앱 버전이 같은지 확인
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(grep '^dongbudget.versionName=' gradle.properties | cut -d= -f2)
          echo "태그: $TAG_VERSION / gradle.properties: $APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::태그($TAG_VERSION)와 gradle.properties 의 versionName($APP_VERSION)이 다르다."
            echo "::error::gradle.properties 의 versionCode 와 versionName 을 올리고 같은 이름으로 태그를 다시 만들어라."
            exit 1
          fi

      # versionCode 가 이전 배포보다 크지 않으면 기기가 설치를 거부한다(INSTALL_FAILED_VERSION_DOWNGRADE).
      # 그런데 앱은 versionName 만 비교하므로 새 버전이 있다고 계속 알린다. 배포 전에 막는다.
      - name: versionCode 가 이전 배포보다 큰지 확인
        run: |
          CODE=$(grep '^dongbudget.versionCode=' gradle.properties | cut -d= -f2)
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            echo "이전 배포 태그가 없다. 첫 배포로 본다."
            exit 0
          fi
          PREV_CODE=$(git show "${PREV_TAG}:gradle.properties" | grep '^dongbudget.versionCode=' | cut -d= -f2)
          echo "이전 배포 ${PREV_TAG}: ${PREV_CODE} / 이번: ${CODE}"
          if [ "$CODE" -le "$PREV_CODE" ]; then
            echo "::error::versionCode(${CODE})가 이전 배포 ${PREV_TAG} 의 ${PREV_CODE} 보다 커야 한다."
            exit 1
          fi

      # 테스트가 깨진 채로 배포되지 않게 한다. main 의 CI 와 따로 돌기 때문에 여기서 다시 돌린다.
      # (패치노트 기록 누락, 버전 비교, 결제 알림 읽기 같은 규칙을 테스트가 지킨다)
      - name: 단위 테스트
        run: ./gradlew testDebugUnitTest

      # 서명키는 저장소에 두지 않는다. Secrets 에 base64 로 넣어두고 여기서만 되살린다.
      # 키가 바뀌면 기존 사용자의 업데이트 설치와 자동 백업 복원이 모두 깨지므로
      # 한 번 만든 키는 절대 바꾸지 않는다.
      # 네 개 중 하나라도 비면 Gradle 이 서명 설정을 만들지 않고
      # 서명 없는 APK 를 조용히 만들어낸다. 여기서 먼저 막는다.
      - name: 서명 시크릿이 모두 있는지 확인
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::서명 시크릿이 없다:$missing"
            echo "::error::저장소 Settings → Secrets and variables → Actions 에서 등록하라."
            exit 1
          fi

      - name: 서명키 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: 서명된 APK 빌드
        env:
          DONG_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          DONG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DONG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DONG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # 서명이 붙었는지, 그리고 '올바른 키로' 붙었는지 확인한다.
      #
      # 두 번째가 핵심이다. 서명키가 바뀐 APK 를 배포하면 기존 사용자는
      # 업데이트를 설치할 수 없고, 앱을 지우고 새로 깔아야 해서 가계부가 전부 사라진다.
      # 배포한 뒤에는 되돌릴 방법이 없으므로 여기서 막는다.
      - name: 서명과 서명키 확인
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          if [ -z "$APK" ]; then echo "::error::APK 를 찾지 못했다."; exit 1; fi
          case "$APK" in
            *unsigned*) echo "::error::서명되지 않은 APK 다. 시크릿 설정을 확인하라."; exit 1 ;;
          esac

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt

          if [ ! -f .signing-fingerprint ]; then
            echo "::error::.signing-fingerprint 가 없어서 서명키를 대조할 수 없다."
            echo "::error::로컬에서 ./scripts/release.sh 를 한 번 돌려 지문을 기록하고 커밋하라."
            exit 1
          fi
          EXPECTED=$(tr -d '[:space:]' < .signing-fingerprint)
          if ! grep -qi "$EXPECTED" certs.txt; then
            echo "::error::서명키가 .signing-fingerprint 와 다르다. 배포를 중단한다."
            echo "::error::이대로 내보내면 기존 사용자가 업데이트를 설치할 수 없고 가계부가 사라진다."
            echo "::error::정말로 키를 바꾸는 것이 맞다면 .signing-fingerprint 를 갱신해서 커밋하라."
            exit 1
          fi
          echo "서명키가 기대값과 일치한다."
          rm -f certs.txt
          echo "SIGNED_APK=$APK" >> "$GITHUB_ENV"

      - name: 배포용 이름으로 변경
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$SIGNED_APK" "dong-budget-${VERSION}.apk"
          ls -lh "dong-budget-${VERSION}.apk"

      - name: 키 파일 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # 릴리스 본문을 두 구간으로 나눈다.
      #   위: 태그 메시지 (이번에 바뀐 점) — 앱이 업데이트 화면에 보여준다
      #   아래: 처음 설치하는 사람용 안내 — 웹 페이지에서만 보인다
      # 둘 사이의 표시는 HTML 주석이라 웹에는 안 보이고, 앱은 그 위쪽만 읽는다.
      # 표시 문자열은 앱의 ReleaseNotes.APP_NOTES_END 와 반드시 같아야 한다.
      - name: 릴리스 본문 만들기
        run: |
          # actions/checkout 은 태그를 가벼운 태그로 가져와서 메시지가 사라진다. 다시 받아온다.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

          NOTES=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" \
              | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          else
            echo "::warning::가벼운 태그라서 바뀐 점을 적을 수 없다. git tag -a 로 메시지를 달아라."
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          {
            printf '%s\n\n' "$NOTES"
            echo "<!-- dong-budget:app-notes-end -->"
            echo
            sed "s/{{VERSION}}/${VERSION}/g" .github/release-install-guide.md
          } > "$RUNNER_TEMP/release-body.md"

          echo "── 만들어진 본문 ──"
          cat "$RUNNER_TEMP/release-body.md"

      - name: Releases 에 올리기
        uses: softprops/action-gh-release@v3
        with:
          files: dong-budget-*.apk
          # 자동 생성 변경 기록은 본문 뒤에 붙는다. 표시 아래라서 앱에는 안 보인다.
          generate_release_notes: true
          draft: false
          # prerelease 로 올리면 안 된다.
          # GitHub API 의 latest 는 prerelease 를 돌려주지 않아서
          # 앱 내 자동 업데이트가 이 버전을 영영 찾지 못한다.
          # 아직 안정 버전이 아니라는 표시는 0.x 버전 번호가 대신한다.
          prerelease: false
          body_path: ${{ runner.temp }}/release-body.md
