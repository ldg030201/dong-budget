name: 빌드 검사

# 코드를 올릴 때마다 컴파일과 정적 검사를 돌린다.
# 배포 태그를 붙이기 전에 깨진 상태를 걸러내는 것이 목적이다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 빌드 검사만 하므로 읽기만 있으면 된다.
# 명시하지 않으면 저장소 기본 권한을 그대로 물려받는다.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # gradle/gradle-daemon-jvm.properties 가 데몬 JVM 을 25 로 고정한다.
      # 여기서 25 를 깔아두지 않으면 Gradle 이 빌드마다 JDK 를 새로 내려받는다(약 145MB).
      - name: JDK 25 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v4

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v5

      - name: 포맷 검사
        run: ./gradlew spotlessCheck

      - name: 디버그 빌드
        run: ./gradlew assembleDebug

      - name: 린트
        run: ./gradlew lintDebug

      - name: 린트 결과 보관
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
