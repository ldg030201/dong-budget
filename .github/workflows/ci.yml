name: 빌드 검사

# 코드를 올릴 때마다 컴파일과 정적 검사를 돌린다.
# 배포 태그를 붙이기 전에 깨진 상태를 걸러내는 것이 목적이다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 빌드 검사만 하므로 읽기만 있으면 된다.
# 명시하지 않으면 저장소 기본 권한을 그대로 물려받는다.
permissions:
  contents: read

jobs:
  build:
    # ubuntu-latest 는 2026-10-19 에 Ubuntu 26 으로 바뀐다.
    # 배포 파이프라인이 예고 없이 깨지지 않도록 러너를 고정한다.
    # 올릴 때는 일부러 올리고 빌드가 통과하는지 확인한 뒤 바꾼다.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # gradle/gradle-daemon-jvm.properties 가 데몬 JVM 을 25 로 고정한다.
      # 여기서 25 를 깔아두지 않으면 Gradle 이 빌드마다 JDK 를 새로 내려받는다(약 145MB).
      - name: JDK 25 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v4

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v5

      - name: 포맷 검사
        run: ./gradlew spotlessCheck

      # 배포처(github·play)마다 들어가는 코드가 달라서 둘 다 빌드하고 검사한다
      - name: 디버그 빌드
        run: ./gradlew assembleGithubDebug assemblePlayDebug

      # 공통 테스트는 github 빌드에서 한 번만, play 빌드는 play 전용 테스트만 돌린다(app/build.gradle.kts).
      # 고정지출 시뮬레이션(6분 남짓)도 여기서는 늘 돈다. 배포 작업은 그 코드가 안 바뀌었으면 건너뛴다.
      - name: 단위 테스트
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest -Pdongbudget.flavorTestsOnly

      - name: 린트
        run: ./gradlew lintGithubDebug lintPlayDebug

      - name: 린트 결과 보관
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-githubDebug.html
            app/build/reports/lint-results-playDebug.html
          if-no-files-found: ignore
