# ── JVM ───────────────────────────────────────────────────────────────
# MaxMetaspaceSize 는 2g 이상이어야 한다. 1g 로 두면 KSP+Room+Compose 컴파일러가 함께 돌 때
# 메타스페이스가 터져서 매 빌드마다 데몬이 재시작하고 빌드가 느려진다 (실측으로 확인).
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8

# ── 빌드 속도 ─────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
# Gradle 9 에서 설정 캐시는 아직 기본 OFF 다. 켜면 2회차 빌드가 크게 빨라진다.
# 문제가 생기면 problems=warn 으로 숨기지 말고(잘못된 캐시가 저장·재사용된다)
# 이 줄을 false 로 바꿔서 기능 자체를 끌 것.
org.gradle.configuration-cache=true

# ── AndroidX ──────────────────────────────────────────────────────────
android.useAndroidX=true

# android.nonTransitiveRClass 는 적지 않는다.
# AGP 8.0 부터 기본값이 true 라서 적을 이유가 없다 (AGP 9 에서 deprecated, AGP 10 에서 제거 예정).

# ── Kotlin ────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── 앱 버전 ───────────────────────────────────────────────────────────
# 배포할 때 이 두 값을 올리고 같은 이름으로 git 태그를 만든다 (예: v1.0.1).
# CI 가 태그와 versionName 이 어긋나면 빌드를 실패시킨다.
# versionCode 는 반드시 단조 증가해야 한다. 낮추면 기기가 설치를 거부한다.
dongbudget.versionCode=1
dongbudget.versionName=1.0.0

# ── 업데이트 배포처 ────────────────────────────────────────────────────
# 앱이 새 버전을 확인할 GitHub 저장소.
dongbudget.githubOwner=ldg030201
dongbudget.githubRepo=dong-budget
